# Tiny CPU-friendly smoke test: pythia-70m, 64 facts, 8-prompt lens sample.
# Verifies the code path end-to-end in a couple of minutes on a laptop.

model:
  name: EleutherAI/pythia-70m-deduped
  dtype: auto
  device: auto
  batch_size: 8

data:
  name: NeelNanda/counterfact-tracing
  split: train
  prompt_column: prompt
  target_column: target_true
  relation_column: relation_id
  limit: 64

lens:
  sample_size: 8
  batch_size: 4
  top_k: 5

output_dir: outputs
seed: 0
