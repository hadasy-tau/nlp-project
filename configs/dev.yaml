# Dev/debug config: pythia-160m-deduped, tiny samples, fast end-to-end run.
# Usage: python -m lora_lens.run --config configs/dev.yaml --stages all

seed: 42
output_dir: outputs_dev

model:
  name: EleutherAI/pythia-160m-deduped
  revision: null
  inference_dtype: float32
  scoring_dtype: null
  device: auto

data:
  # Same loader path as default.yaml, so dev exercises the real code.
  dataset: azhx/counterfact
  split: train
  max_records: 1000
  fields:
    prompt: requested_rewrite.prompt
    subject: requested_rewrite.subject
    target_true: requested_rewrite.target_true.str
    target_false: requested_rewrite.target_new.str
    relation: requested_rewrite.relation_id
    paraphrases: paraphrase_prompts
  min_known_facts: 10      # 160m knows ~18 of 905 facts; dev only exercises code paths
  n_per_condition: 50
  max_relation_fraction: 0.5
  synthetic:
    n_facts: 30
    seed: 0

scoring:
  batch_size: 32

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [query_key_value]
  lr: 1.0e-4
  epochs: 2
  batch_size: 8
  checkpoint_every: 20
  max_grad_norm: 1.0

lens:
  use_logit: true
  use_tuned: true
  tuned_lens_id: null

analysis:
  batch_size: 16
  allow_reconcile: false
  logprob_atol: 0.05
  top_k: [1, 5, 10]
  checkpoints: all
  eval_paraphrases: true

patching:
  enabled: true
  batch_size: 8
  max_facts_per_condition: 20
