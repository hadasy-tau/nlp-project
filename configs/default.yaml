# Primary config: pythia-410m-deduped on CounterFact.
# Override any key from the CLI: --set model.name=EleutherAI/pythia-1b-deduped

seed: 42
output_dir: outputs   # on Kaggle, override to /kaggle/working/outputs

model:
  name: EleutherAI/pythia-410m-deduped
  revision: null
  # fp32: fp16 rank ties flip between passes and corrupt the condition split.
  inference_dtype: float32
  device: auto            # auto | cuda | cpu

data:
  # Full CounterFact — the only mirror that ships paraphrase_prompts, which the
  # held-out generalization probe needs. The flattened NeelNanda/counterfact-tracing
  # has no paraphrases; see the alternative mapping in the README.
  dataset: azhx/counterfact
  split: train
  max_records: null        # cap for smoke tests, e.g. 2000
  # Field mapping — dotted paths reach into nested schemas. Change here (not in
  # code) to swap in a different fact dataset.
  fields:
    prompt: requested_rewrite.prompt          # a '{}' template; subject is filled in
    subject: requested_rewrite.subject
    target_true: requested_rewrite.target_true.str
    target_false: requested_rewrite.target_new.str
    relation: requested_rewrite.relation_id
    paraphrases: paraphrase_prompts   # set null if the dataset has none
    neighborhood: neighborhood_prompts        # for locality scoring; set null to skip
  # Decision rule from the handoff: need >= this many base-model-known facts,
  # otherwise move one model size up.
  min_known_facts: 300
  # Per-condition sample sizes for LoRA training (null = use all available).
  n_per_condition: 500
  # Stratification guard: no single relation may exceed this fraction of a condition.
  max_relation_fraction: 0.25
  synthetic:
    n_facts: 200
    seed: 0
    # Diversity/confound controls for pseudo-entity generation (make_synthetic in
    # data.py). All are auditable after the fact via
    # <output_dir>/synthetic_diversity_report.csv.
    # Percentile range of the real-subject BPE token-length distribution that
    # pseudo-names are resampled to fall within (tokenization confound guard).
    token_length_low_pct: 5
    token_length_high_pct: 95
    # Max fraction of a relation's synthetic facts that may share the same object,
    # measured per-relation and globally (cross-relation) respectively.
    max_object_relation_fraction: 0.3
    max_object_global_fraction: 0.15
    # Max fraction of a relation's synthetic facts that may share the same
    # (template, object) pair.
    max_pair_fraction: 0.15
    # Max allowed syllable usage rate, expressed as a multiple of the uniform
    # rate (1 / len(syllable pool)).
    syllable_tolerance: 2.5
    # Number of held-out paraphrases to generate per synthetic fact (sampled
    # from that relation's real paraphrase templates), as [min, max].
    n_paraphrases: [2, 3]

scoring:
  batch_size: 64

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [query_key_value]   # GPTNeoX attention; use [c_attn] for GPT-2
  lr: 1.0e-4
  epochs: 5
  batch_size: 16
  # Save the adapter every N optimizer steps -> metrics as a function of training
  # step (pitfall 4: don't confound fact type with amount of learning).
  checkpoint_every: 50
  max_grad_norm: 1.0

lens:
  use_logit: true
  use_tuned: true
  # null = use model.name as the lens resource id on the AlignmentResearch/tuned-lens space
  tuned_lens_id: null

analysis:
  batch_size: 32
  # true overwrites base rows that disagree with score_base instead of aborting.
  allow_reconcile: false
  # Structural-breakage guard on the base-vs-score_base log-prob gap, not a precision test.
  logprob_atol: 0.05
  top_k: [1, 5, 10]
  # Which checkpoints to analyze; "all" or a list of steps, always includes final.
  checkpoints: all
  eval_paraphrases: true   # heldout paraphrases are never seen in training

patching:
  enabled: true
  batch_size: 16
  max_facts_per_condition: 100
  # Self and mismatched-donor specificity controls, at the final checkpoint only.
  controls: true

rank_ablation:
  enabled: true
  ranks: [4, 8, 16, 32]
  # alpha = r * alpha_multiplier keeps the alpha/r ratio constant across ranks.
  alpha_multiplier: 2
  # Matches lora.epochs (falls back to it if unset) so the r=16 ablation point is
  # directly comparable to the main table's r=16 point instead of a different,
  # less-trained model.
  epochs: 5
